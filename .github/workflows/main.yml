name: Shorts Auto

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper google-genai google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Download source video from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import os
          import json
          import io
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          SCOPES = ["https://www.googleapis.com/auth/drive"]

          info = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])

          credentials = service_account.Credentials.from_service_account_info(
              info,
              scopes=SCOPES
          )

          drive = build(
              "drive",
              "v3",
              credentials=credentials,
              cache_discovery=False
          )

          print("Searching for shorts-input folder...")

          folders = drive.files().list(
              q="name = 'shorts-input' and mimeType = 'application/vnd.google-apps.folder' and trashed = false",
              spaces="drive",
              fields="files(id,name,modifiedTime)",
              orderBy="modifiedTime desc"
          ).execute()

          folder_list = folders.get("files", [])

          if not folder_list:
              raise RuntimeError("ERROR: shorts-input folder was not found.")

          input_folder = folder_list[0]

          print(f"Found folder: {input_folder['name']}")
          print(f"Folder ID: {input_folder['id']}")

          files = drive.files().list(
              q=f"'{input_folder['id']}' in parents and trashed = false",
              spaces="drive",
              fields="files(id,name,mimeType,modifiedTime,size)",
              orderBy="modifiedTime desc"
          ).execute()

          all_files = files.get("files", [])

          video_files = []

          for file in all_files:
              mime_type = file.get("mimeType", "")
              name = file.get("name", "").lower()

              if mime_type.startswith("video/"):
                  video_files.append(file)
              elif name.endswith((".mp4", ".mov", ".m4v", ".avi", ".mkv", ".webm")):
                  video_files.append(file)

          if not video_files:
              raise RuntimeError("ERROR: No video files found inside shorts-input.")

          source = video_files[0]

          print("Selected video:")
          print(f"Name: {source['name']}")
          print(f"ID: {source['id']}")
          print(f"Modified: {source.get('modifiedTime')}")
          print(f"Size: {source.get('size', 'unknown')} bytes")

          os.makedirs("input", exist_ok=True)

          output_path = "input/source_video.mp4"

          request = drive.files().get_media(
              fileId=source["id"]
          )

          with io.FileIO(output_path, "wb") as fh:
              downloader = MediaIoBaseDownload(
                  fh,
                  request
              )

              done = False

              while not done:
                  status, done = downloader.next_chunk()

                  if status:
                      progress = int(status.progress() * 100)
                      print(f"Download progress: {progress}%")

          print("Download completed.")
          print(f"Saved to: {output_path}")
          PY

      - name: Verify downloaded video
        run: |
          echo "===== INPUT VIDEO ====="
          ls -lh input/

          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            input/source_video.mp4

      - name: Test Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/test_gemini.py

      - name: Analyze source video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/analyze_video.py "input/source_video.mp4"

      - name: Render Shorts
        run: |
          python scripts/render_shorts.py

      - name: Add captions
        run: |
          python scripts/add_captions.py

      - name: Show generated Shorts
        run: |
          echo "===== GENERATED SHORTS ====="
          ls -lh output/

      - name: Upload Shorts to Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import os
          import json
          import mimetypes
          from pathlib import Path

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          SCOPES = ["https://www.googleapis.com/auth/drive"]

          info = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])

          credentials = service_account.Credentials.from_service_account_info(
              info,
              scopes=SCOPES
          )

          drive = build(
              "drive",
              "v3",
              credentials=credentials,
              cache_discovery=False
          )

          print("Searching for shorts-output folder...")

          folders = drive.files().list(
              q="name = 'shorts-output' and mimeType = 'application/vnd.google-apps.folder' and trashed = false",
              spaces="drive",
              fields="files(id,name,modifiedTime)",
              orderBy="modifiedTime desc"
          ).execute()

          folder_list = folders.get("files", [])

          if not folder_list:
              raise RuntimeError("ERROR: shorts-output folder was not found.")

          output_folder = folder_list[0]

          print(f"Found output folder: {output_folder['name']}")
          print(f"Folder ID: {output_folder['id']}")

          output_dir = Path("output")

          if not output_dir.exists():
              raise RuntimeError("ERROR: output directory does not exist.")

          video_files = []

          for path in output_dir.iterdir():
              if path.is_file() and path.suffix.lower() in (
                  ".mp4",
                  ".mov",
                  ".m4v",
                  ".webm"
              ):
                  video_files.append(path)

          if not video_files:
              raise RuntimeError("ERROR: No generated video files found in output/.")

          print(f"Found {len(video_files)} generated video(s).")

          for video_path in video_files:
              print(f"Uploading: {video_path.name}")

              mime_type = (
                  mimetypes.guess_type(video_path.name)[0]
                  or "video/mp4"
              )

              metadata = {
                  "name": video_path.name,
                  "parents": [output_folder["id"]]
              }

              media = MediaFileUpload(
                  str(video_path),
                  mimetype=mime_type,
                  resumable=True
              )

              uploaded = drive.files().create(
                  body=metadata,
                  media_body=media,
                  fields="id,name,webViewLink"
              ).execute()

              print(f"Uploaded successfully: {uploaded.get('name')}")
              print(f"Drive file ID: {uploaded.get('id')}")

          print("===== GOOGLE DRIVE UPLOAD COMPLETE =====")
          PY

      - name: Upload Shorts as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts
          path: output/
          if-no-files-found: error
