name: Shorts Auto

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "av==12.3.0" faster-whisper google-genai google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests

      - name: Download source video from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import os
          import json
          import time
          from pathlib import Path

          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          from googleapiclient.discovery import build

          SCOPES = ["https://www.googleapis.com/auth/drive"]

          info = json.loads(
              os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]
          )

          credentials = service_account.Credentials.from_service_account_info(
              info,
              scopes=SCOPES
          )

          drive = build(
              "drive",
              "v3",
              credentials=credentials,
              cache_discovery=False
          )

          print("Searching for shorts-input folder...")

          folders = drive.files().list(
              q="name = 'shorts-input' and mimeType = 'application/vnd.google-apps.folder' and trashed = false",
              spaces="drive",
              fields="files(id,name,modifiedTime)",
              orderBy="modifiedTime desc"
          ).execute()

          folder_list = folders.get("files", [])

          if not folder_list:
              raise RuntimeError(
                  "ERROR: shorts-input folder was not found."
              )

          input_folder = folder_list[0]

          print(f"Found folder: {input_folder['name']}")
          print(f"Folder ID: {input_folder['id']}")

          files = drive.files().list(
              q=f"'{input_folder['id']}' in parents and trashed = false",
              spaces="drive",
              fields="files(id,name,mimeType,modifiedTime,size)",
              orderBy="modifiedTime desc"
          ).execute()

          all_files = files.get("files", [])

          video_files = []

          for file in all_files:
              mime_type = file.get("mimeType", "")
              name = file.get("name", "").lower()

              if mime_type.startswith("video/"):
                  video_files.append(file)

              elif name.endswith(
                  (".mp4", ".mov", ".m4v", ".avi", ".mkv", ".webm")
              ):
                  video_files.append(file)

          if not video_files:
              raise RuntimeError(
                  "ERROR: No video files found inside shorts-input."
              )

          source = video_files[0]

          file_id = source["id"]
          file_name = source["name"]

          print("Selected video:")
          print(f"Name: {file_name}")
          print(f"ID: {file_id}")
          print(f"Modified: {source.get('modifiedTime')}")
          print(f"Size: {source.get('size', 'unknown')} bytes")

          os.makedirs("input", exist_ok=True)

          output_path = Path("input/MASTER.mp4")

          if not source.get("size"):
              raise RuntimeError(
                  "ERROR: Google Drive did not provide the video size."
              )

          total_size = int(source["size"])

          print(f"Total video size: {total_size} bytes")

          session = AuthorizedSession(credentials)

          download_url = (
              "https://www.googleapis.com/drive/v3/files/"
              + file_id
              + "?alt=media"
          )

          chunk_size = 8 * 1024 * 1024
          position = 0

          if output_path.exists():
              existing_size = output_path.stat().st_size

              if existing_size < total_size:
                  position = existing_size
                  print(
                      f"Resuming existing download from byte {position}"
                  )

              elif existing_size == total_size:
                  print("Video already fully downloaded.")
                  position = total_size

              else:
                  print("Existing file is larger than expected.")
                  output_path.unlink()

          if position < total_size:

              with open(output_path, "ab") as output_file:

                  while position < total_size:

                      end = min(
                          position + chunk_size - 1,
                          total_size - 1
                      )

                      headers = {
                          "Range": f"bytes={position}-{end}"
                      }

                      success = False

                      for attempt in range(1, 6):

                          try:
                              print(
                                  f"Downloading bytes "
                                  f"{position}-{end} "
                                  f"(attempt {attempt}/5)"
                              )

                              response = session.get(
                                  download_url,
                                  headers=headers,
                                  stream=True,
                                  timeout=(30, 180)
                              )

                              response.raise_for_status()

                              expected = end - position + 1
                              received = 0

                              for data in response.iter_content(
                                  chunk_size=1024 * 1024
                              ):
                                  if not data:
                                      continue

                                  output_file.write(data)
                                  output_file.flush()

                                  received += len(data)

                              response.close()

                              if received != expected:
                                  raise RuntimeError(
                                      f"Incomplete chunk: "
                                      f"received {received} "
                                      f"of {expected} bytes"
                                  )

                              position = end + 1

                              progress = (
                                  position / total_size
                              ) * 100

                              print(
                                  f"Download progress: "
                                  f"{progress:.1f}%"
                              )

                              success = True
                              break

                          except Exception as error:

                              print(
                                  f"Download attempt failed: {error}"
                              )

                              if attempt < 5:
                                  wait_time = attempt * 3

                                  print(
                                      f"Retrying in "
                                      f"{wait_time} seconds..."
                                  )

                                  time.sleep(wait_time)

                      if not success:
                          raise RuntimeError(
                              "ERROR: Failed to download "
                              "the current video chunk "
                              "after 5 attempts."
                          )

          final_size = output_path.stat().st_size

          if final_size != total_size:
              raise RuntimeError(
                  f"ERROR: Download incomplete. "
                  f"Expected {total_size} bytes, "
                  f"got {final_size} bytes."
              )

          print("================================")
          print("DOWNLOAD COMPLETED SUCCESSFULLY")
          print(f"File: {output_path}")
          print(f"Size: {final_size} bytes")
          print("================================")
          PY

      - name: Verify downloaded video
        run: |
          echo "===== INPUT VIDEO ====="
          ls -lh input/

          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            input/MASTER.mp4

      - name: Test Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/test_gemini.py

      - name: Analyze source video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/analyze_video.py "input/MASTER.mp4"

      - name: Render Shorts
        run: |
          python scripts/render_shorts.py

      - name: Add captions
        run: |
          python scripts/add_captions.py

      - name: Show generated Shorts
        run: |
          echo "===== GENERATED SHORTS ====="
          ls -lh output/

      - name: Upload Shorts to Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import os
          import json
          import mimetypes
          from pathlib import Path

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          SCOPES = ["https://www.googleapis.com/auth/drive"]

          info = json.loads(
              os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]
          )

          credentials = service_account.Credentials.from_service_account_info(
              info,
              scopes=SCOPES
          )

          drive = build(
              "drive",
              "v3",
              credentials=credentials,
              cache_discovery=False
          )

          print("Searching for shorts-output folder...")

          folders = drive.files().list(
              q="name = 'shorts-output' and mimeType = 'application/vnd.google-apps.folder' and trashed = false",
              spaces="drive",
              fields="files(id,name,modifiedTime)",
              orderBy="modifiedTime desc"
          ).execute()

          folder_list = folders.get("files", [])

          if not folder_list:
              raise RuntimeError(
                  "ERROR: shorts-output folder was not found."
              )

          output_folder = folder_list[0]

          print(
              f"Found output folder: "
              f"{output_folder['name']}"
          )

          print(
              f"Folder ID: "
              f"{output_folder['id']}"
          )

          output_dir = Path("output")

          if not output_dir.exists():
              raise RuntimeError(
                  "ERROR: output directory does not exist."
              )

          video_files = []

          for path in output_dir.iterdir():

              if (
                  path.is_file()
                  and path.suffix.lower()
                  in (".mp4", ".mov", ".m4v", ".webm")
              ):
                  video_files.append(path)

          if not video_files:
              raise RuntimeError(
                  "ERROR: No generated video files found in output/."
              )

          print(
              f"Found {len(video_files)} generated video(s)."
          )

          for video_path in video_files:

              print(
                  f"Uploading: "
                  f"{video_path.name}"
              )

              mime_type = (
                  mimetypes.guess_type(
                      video_path.name
                  )[0]
                  or "video/mp4"
              )

              metadata = {
                  "name": video_path.name,
                  "parents": [output_folder["id"]]
              }

              media = MediaFileUpload(
                  str(video_path),
                  mimetype=mime_type,
                  resumable=True
              )

              uploaded = drive.files().create(
                  body=metadata,
                  media_body=media,
                  fields="id,name,webViewLink"
              ).execute()

              print(
                  f"Uploaded successfully: "
                  f"{uploaded.get('name')}"
              )

              print(
                  f"Drive file ID: "
                  f"{uploaded.get('id')}"
              )

          print(
              "===== GOOGLE DRIVE UPLOAD COMPLETE ====="
          )
          PY

      - name: Upload Shorts as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts
          path: output/
          if-no-files-found: error
