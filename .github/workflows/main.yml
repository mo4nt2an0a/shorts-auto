name: Shorts Auto

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Test Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/test_gemini.py

      - name: Analyze source video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/analyze_video.py "input/VID_20260921_015943_064.mp4"

      - name: Render Shorts
        run: |
          python scripts/render_shorts.py

      - name: Show generated Shorts
        run: |
          echo "===== GENERATED SHORTS ====="
          ls -lh output/
